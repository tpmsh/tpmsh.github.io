<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      // Redirect all 404s to the index.html with the original route preserved
      // This allows client-side routing to handle the request
      const path = window.location.pathname;
      const redirect = path + window.location.search + window.location.hash;
      window.location.href = '/?redirect=' + encodeURIComponent(redirect);
    </script>
  </head>
  <body></body>
</html>
